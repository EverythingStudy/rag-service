server:
  port: 8080

spring:
  application:
    name: rag-pgvector

  # Java 21 virtual threads — blocking I/O (LLM API, JDBC) no longer blocks OS threads
  threads:
    virtual:
      enabled: true

  # File upload limits
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  # PostgreSQL datasource (requires pgvector extension)
  datasource:
    url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/ragdb}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:st20240807}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 5000
      max-lifetime: 1800000
      idle-timeout: 600000
      pool-name: RagHikariCP

  ai:
    # DeepSeek LLM via OpenAI-compatible API
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-b353c98299e94f1491c848436c9e2aa5}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      embedding:
        enabled: false  # DeepSeek has no embedding API, use DashScope instead

    # DashScope (阿里通义千问) — 仅用于 embedding，chat 走 DeepSeek
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-7d8637e8c1b34e7aa901dade275a1c7b}
      base-url: https://dashscope.aliyuncs.com
      chat:
        enabled: false
      embedding:
        enabled: true
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v2}

    # PgVectorStore configuration
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimension: 1536    # text-embedding-v2 output dimensions
        initialize-schema: true  # auto-create vector extension and table

# RAG ingestion settings
rag:
  ingestion:
    chunk:
      max-size: 500       # max characters per chunk
      overlap: 50         # character overlap between chunks
      topic-threshold: 0.7
    batch:
      size: 50            # documents per batch for vector store insert
    parallel: true        # enable parallel document processing
    threads: 4            # thread pool size for parallel processing
    max-concurrent: 2     # max files processed concurrently
    max-file-size: 104857600  # max single file size in bytes (100MB)
    parse-timeout: 300    # max seconds per file for parse + chunk + embed
    retry:
      max-attempts: 3     # embedding API retry count
      backoff-delay: 1000 # initial retry delay in ms

  # Query optimization
  query:
    rewrite:
      enabled: true       # LLM rewrites user query for better retrieval recall
    rerank:
      multiplier: 3       # candidate count = topK * multiplier, then rerank
      vector-weight: 0.6  # hybrid score: vector weight (rest is keyword overlap)
    context:
      max-chars: 4000     # max context chars sent to LLM (reduced from 8000)
      max-docs: 3         # max documents included in context (reduces token waste)

logging:
  level:
    cn.project.base.ragpgvector: DEBUG

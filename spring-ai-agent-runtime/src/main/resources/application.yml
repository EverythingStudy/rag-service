server:
  port: 8098
  

spring:
  application:
    path: /
    name: spring-ai-agent-runtime
  datasource:
    url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/ragdb}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:st20240807}
    driver-class-name: org.postgresql.Driver
  ai:
    # DeepSeek (兼容 OpenAI API 协议，仅用于 chat)
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-b353c98299e94f1491c848436c9e2aa5}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      embedding:
        enabled: false   # DeepSeek 无 embedding API，由 DashScope embedding 替代

   # DashScope (阿里通义千问) — 仅用于 embedding，chat 走 DeepSeek
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-7d8637e8c1b34e7aa901dade275a1c7b}
      base-url: https://dashscope.aliyuncs.com
      chat:
        enabled: false
      embedding:
        enabled: true
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v2}

    # Ollama 已移除，由 DashScope embedding + PgVectorStore 替代
    # ollama:
    #   chat:
    #     enabled: false
    #   embedding:
    #     enabled: true

    # PgVectorStore configuration
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimension: 1536    # text-embedding-v2 output dimensions
        initialize-schema: true  # auto-create vector extension and table

    # ──────────────────────────────
    # MCP Client — connects to external MCP servers (MySQL, Redis, PostgreSQL)
    # Each MCP server exposes database operations as AI-callable tools.
    # Add new MCP server connections under sse.connections to extend agent capabilities.
    # ──────────────────────────────
    mcp:
      client:
        enabled: true
        name: agent-runtime-mcp
        version: 1.0.0
        type: ASYNC
        request-timeout: 30s
        sse:
          connections:
            mysql-mcp:
              url: http://localhost:8082
            # redis-mcp:
            #   url: http://localhost:8083
            # postgres-mcp:
            #   url: http://localhost:8084

    # ──────────────────────────────
    # Vector Store — for RAG document retrieval
    # Default: simple in-memory store; switch to chroma/milvus for production
    # ──────────────────────────────
    # vectorstore:
    #   type: ${VECTOR_STORE_TYPE:simple}

# ChromaDB settings (only used when vectorstore.type=chroma)
chroma:
  url: ${CHROMA_URL:http://localhost:8000}
  collection-name: agent-knowledge-base

# Agent-specific settings
agent:
  max-retrieval-results: 5
  retrieval-min-score: 0.5
  system-prompt: |
    你是一个智能AI助手，具有以下能力：

    ## 工具使用
    你可以使用MCP工具连接数据库（MySQL、Redis、PostgreSQL）执行查询和操作，也可以使用内置技能完成各种任务。

    ## 知识库检索
    你可以从知识库中检索相关信息来增强回答。当遇到不确定的问题时，主动检索相关知识。

    ## 行为准则
    1. 在操作数据库前，先确认用户意图，确保操作安全
    2. 对于敏感操作（修改/删除数据），需二次确认
    3. 如果无法从工具或知识库获得足够信息，坦诚告知用户
    4. 使用中文回答，除非用户使用其他语言

logging:
  level:
    cn.project.base.agentruntime: DEBUG
    io.modelcontextprotocol: DEBUG
